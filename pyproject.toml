[project]
name = "weather-underground-uploader"
version = "0.1.0"
description = "Upload normalized MQTT weather observations to Weather Underground PWS."
authors = [{ name = "pokornyIt" }]
license = "MIT"
requires-python = ">=3.14,<3.15"
dependencies = []

[dependency-groups]
dev = ["pre-commit>=4.0", "pyright>=1.1.390", "pytest>=8.0", "ruff>=0.9"]

[tool.pyright]
exclude = [".venv"]
pythonVersion = "3.14"
typeCheckingMode = "strict"
venv = ".venv"
venvPath = "."

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
ignore = ["D100", "D104", "D105", "D107"]
select = ["ANN", "B", "D", "E4", "E7", "E9", "F", "I", "N", "RUF", "SIM", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"
