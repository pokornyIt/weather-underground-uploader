name: CI

"on":
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.2"
          python-version: "3.14"
          enable-cache: true

      - name: Synchronize dependencies
        run: uv sync --locked

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Run linting
        run: uv run ruff check .

      - name: Run type checking
        run: uv run pyright

      - name: Run tests
        run: uv run pytest

      - name: Run repository hooks
        run: uv run pre-commit run --all-files

  container:
    name: Container validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build container image
        run: docker build --tag weather-underground-uploader:ci .

      - name: Verify container entry point
        run: docker run --rm weather-underground-uploader:ci --help

      - name: Verify non-root container user
        run: docker image inspect weather-underground-uploader:ci --format '{{.Config.User}}' | grep -Fx '10001:10001'

      - name: Prepare Compose examples
        run: |
          cp .env.example .env
          cp config.example.yaml config.yaml

      - name: Validate Compose configuration
        run: docker compose config --quiet
